name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: |
          npm run build
          # التأكد من وجود مجلد dist أو تحويل مجلد البناء إليه إن وجد
          if [ ! -d "dist" ] && [ -d "build" ]; then
            cp -r build dist
          elif [ ! -d "dist" ] && [ -d "out" ]; then
            cp -r out dist
          fi

      - name: Initialize Capacitor & Add Android Platform
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android
          
          # إنشاء إعدادات كاباسيتر موجهة لمجلد dist
          echo '{
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }' > capacitor.config.json

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

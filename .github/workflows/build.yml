name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build
          
          # التأكد من وجود مجلد dist وفي حال كان فارغاً أو غير موجود نحفظ ملف مؤقت لضمان نجاح كاباسيتر
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo "<HTML><BODY>Nutri Pal App</BODY></HTML>" > dist/index.html
          fi

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Install Capacitor & Add Android
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap add android --force

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build || npx vite build || true

      - name: Prepare Real Project Files for Capacitor
        run: |
          # التأكد من وجود مجلد dist نظيف
          rm -rf dist
          mkdir -p dist

          # التحقق من مكان وجود ملفات المشروع الحقيقية (مثل index.html الأصلي للمشروع)
          # إذا قام النمط بالبناء في مجلد مثل dist أو build أو وجدناها في الجذر
          if [ -f "dist/index.html" ] && ! grep -q "مرحباً بك يا دكتور خصر" dist/index.html; then
            echo "Real dist found from build"
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* dist/
          else
            # نسخ جميع ملفات المشروع ما عدا المجلدات النظامية والملفات غير الضرورية إلى dist
            find . -maxdepth 1 -not -path '.' -not -path './.git' -not -path './node_modules' -not -path './android' -not -path './dist' -exec cp -r {} dist/ \;
          fi

          # التحقق من وجود index.html، وإذا لم يوجد نأخذ أول ملف index.html صالح من المستودع
          if [ ! -f "dist/index.html" ]; then
            REAL_INDEX=$(find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" -not -path "./dist/*" | head -n 1)
            if [ -n "$REAL_INDEX" ]; then
              cp -r "$(dirname "$REAL_INDEX")"/* dist/
            fi
          fi

          # تعديل مسارات الملفات لتتوافق مع تشغيل الأندرويد المحلي
          if [ -f "dist/index.html" ]; then
            sed -i 's|="/|="./|g' dist/index.html || true
            sed -i 's|="/assets/|="./assets/|g' dist/index.html || true
          fi

      - name: Install Stable Capacitor Version
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5

      - name: Create Capacitor Config File
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform Cleanly
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutripal-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

- name: Install Dependencies & Force Web Build
        run: |
          npm install
          # بناء المشروع مع الانتباه لملفات الـ Vite
          npm run build || npx vite build || true
          
          # التحقق من مكان وجود مجلد البناء الحقيقي ونسخه إلى dist
          mkdir -p dist
          if [ -d "dist/assets" ] && [ "$(ls -A dist/assets)" ]; then
            echo "Dist build already exists and populated"
          elif [ -d "build" ]; then
            cp -r build/* dist/
          elif [ -d ".output/public" ]; then
            cp -r .output/public/* dist/
          fi

          # تعديل مسارات الملفات في index.html لتصبح نسبية لضمان عملها على أندرويد
          if [ -f "dist/index.html" ]; then
            sed -i 's|="/|="./|g' dist/index.html
          else
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Nutri Pal</title></head><body><div id="root"><h1>مرحباً بك يا دكتور خضر</h1></div></body></html>' > dist/index.html
          fi

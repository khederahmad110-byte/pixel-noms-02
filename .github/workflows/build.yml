name: بناء ملف APK لنظام Android

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: رمز الدفع
        uses: actions/checkout@v4

      - name: قم بتثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: قم بتثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: قم بتثبيت Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: تثبيت Capacitor فقط (لا حاجة لبناء المشروع كاملاً)
        run: bun add @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5

      - name: إنشاء مجلد ويب بديل (placeholder) لتفعيل Capacitor
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head><meta charset="UTF-8"><title>نوتري بال</title></head>
          <body></body>
          </html>
          EOF

      - name: إنشاء ملف تكوين Capacitor (يفتح مباشرة الرابط المنشور)
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "نوتري بال",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://pixel-noms-02.lovable.app",
              "androidScheme": "https"
            }
          }
          EOF

      - name: إعداد منصة أندرويد
        run: |
          rm -rf android
          bunx cap add android
          bunx cap sync android

      - name: منح صلاحية التنفيذ لـ gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: بناء ملف APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: تحميل ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

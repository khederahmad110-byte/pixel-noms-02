name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo "<HTML><BODY>Nutri Pal App</BODY></HTML>" > dist/index.html
          fi

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Create Capacitor Config File
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform Cleanly
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Overwrite Kotlin Version in All Gradle Files
        run: |
          cd android
          # البحث عن أي استخدام لإصدار كوتلين القديم 1.6.21 أو ما شابه واستبداله بالنسخة الحديثة 1.9.24
          find . -name "*.gradle" -type f -exec sed -i "s/1.6.21/1.9.24/g" {} +
          find . -name "*.gradle" -type f -exec sed -i "s/kotlin_version =.*/kotlin_version = '1.9.24'/g" {} +
          find . -name "*.gradle" -type f -exec sed -i "s/ext.kotlinVersion =.*/ext.kotlinVersion = '1.9.24'/g" {} +
          
          # إضافة إصدار كوتلين إجبارياً في ملف build.gradle الرئيسي إذا لم يكن موجوداً
          if [ -f "build.gradle" ]; then
            if ! grep -q "kotlinVersion" build.gradle; then
              sed -i "/buildscript {/a \    ext.kotlinVersion = '1.9.24'" build.gradle || true
            fi
          fi

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

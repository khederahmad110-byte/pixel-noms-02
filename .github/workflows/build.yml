name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Lovable Project
        run: |
          npm install
          # تشغيل بناء مشروع لوفابل (Vite)
          npm run build

      - name: Prepare Capacitor Web Directory
        run: |
          mkdir -p dist
          # التأكد من نسخ ملفات البناء الناتجة من لوفابل إلى مسار كاباسيتر
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "Dist folder is ready"
          elif [ -d "build" ]; then
            cp -r build/* dist/
          fi

          # تحويل المسارات المطلقة إلى نسبية لتعمل داخل تطبيق الأندرويد بسلاسة
          if [ -f "dist/index.html" ]; then
            sed -i 's|="/|="./|g' dist/index.html
            sed -i 's|="/assets/|="./assets/|g' dist/index.html
          fi

      - name: Install Stable Capacitor Version
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5

      - name: Create Capacitor Config File
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform Cleanly
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutripal-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: بناء ملف APK لنظام Android

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: رمز الدفع
        uses: actions/checkout@v4

      - name: قم بتثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: قم بتثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت الحزم الأساسية
        run: npm install --legacy-peer-deps

      - name: بناء مشروع TanStack Start الحقيقي
        run: |
          npm run build

      - name: تجهيز مجلد الويب للمكثف
        run: |
          # التأكد من نقل مخرجات البناء الحقيقية إلى مجلد dist إذا كانت في .output/public
          if [ -d ".output/public" ]; then
            rm -rf dist
            mkdir -p dist
            cp -r .output/public/* dist/
          elif [ -d "dist" ]; then
            echo "مجلد dist موجود بالفعل وجاهز."
          else
            mkdir -p dist
          fi

      - name: تثبيت المكثف
        run: npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5 --legacy-peer-deps

      - name: إنشاء ملف تكوين المكثف
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "نوتري بال",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: إعداد منصة أندرويد
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: منح صلاحية التنفيذ لـ gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: بناء ملف APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: تحميل ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: إعداد منصة أندرويد

name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build || npx vite build || true

      - name: Fix and Copy Web Assets for Capacitor
        run: |
          mkdir -p dist
          
          # التحقق من مكان وجود مخرجات البناء الحقيقية ونسخها
          if [ -d "dist" ] && [ -f "dist/index.html" ] && [ "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "Dist is already fully populated"
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* dist/
          elif [ -d "dist" ] && [ ! -f "dist/index.html" ]; then
            # البحث عن أي ملف index.html في المشروع ونسخه مع أصوله
            FOUND_IDX=$(find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" | head -n 1)
            if [ -n "$FOUND_IDX" ]; then
              cp -r "$(dirname "$FOUND_IDX")"/* dist/
            fi
          fi

          # التحويل الإجباري للمسارات المطلقة إلى نسبية لكي يتعرف عليها أندرويد
          if [ -f "dist/index.html" ]; then
            sed -i 's|="/|="./|g' dist/index.html
            sed -i 's|="/assets/|="./assets/|g' dist/index.html
            sed -i "s|='/|='./|g" dist/index.html
          fi

      - name: Install Stable Capacitor Version
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5

      - name: Create Capacitor Config File
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform Cleanly
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutripal-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

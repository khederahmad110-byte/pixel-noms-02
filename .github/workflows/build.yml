name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets
        run: |
          npm install --legacy-peer-deps || true
          npm run build || npx vite build || echo "Build skipped"
          # ضمان وجود مجلد dist وملف HTML أساسي لكي لا يفشل الكاباسيتور
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo "<!DOCTYPE html><html><head><title>App</title></head><body><div id='root'></div></body></html>" > dist/index.html
          fi

      - name: Install Stable Capacitor Version
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5 --force

      - name: Create Capacitor Config File
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutripal-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

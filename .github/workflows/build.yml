name: بناء ملف APK لنظام Android

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: رمز الدفع
        uses: actions/checkout@v4

      - name: قم بتثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: قم بتثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت الحزم الأساسية
        run: npm install --legacy-peer-deps

      - name: بناء المشروع (بدون إخفاء الأخطاء)
        run: npm run build

      - name: فحص مخرجات البناء (تشخيص)
        run: |
          echo "=== محتويات المجلد الجذري ==="
          ls -la
          echo ""
          echo "=== هل يوجد .output؟ ==="
          [ -d ".output" ] && find .output -maxdepth 3 -type d || echo "لا يوجد .output"
          echo ""
          echo "=== هل يوجد dist؟ ==="
          [ -d "dist" ] && find dist -maxdepth 3 -type d || echo "لا يوجد dist"
          echo ""
          echo "=== هل يوجد build؟ ==="
          [ -d "build" ] && find build -maxdepth 3 -type d || echo "لا يوجد build"

      - name: تجهيز مجلد www للنشر
        run: |
          rm -rf www
          if [ -f ".output/public/index.html" ]; then
            echo "تم العثور على مخرجات TanStack Start (Nitro) في .output/public"
            cp -r .output/public www
          elif [ -f "dist/index.html" ]; then
            echo "تم العثور على مخرجات Vite القياسية في dist"
            cp -r dist www
          elif [ -f "build/index.html" ]; then
            echo "تم العثور على مخرجات في build"
            cp -r build www
          else
            echo "❌ لم يتم العثور على index.html في أي مسار متوقع"
            echo "راجع نتائج خطوة الفحص أعلاه لمعرفة المسار الصحيح يدوياً"
            exit 1
          fi
          echo "=== محتويات www النهائية ==="
          ls -la www

      - name: تثبيت Capacitor
        run: npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5 --legacy-peer-deps

      - name: إنشاء ملف تكوين Capacitor
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "نوتري بال",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: إعداد منصة أندرويد
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: منح صلاحية التنفيذ لـ gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: بناء ملف APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: تحميل ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

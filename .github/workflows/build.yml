- name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build || npx vite build || echo "No build script"
          # نسخ الملفات من أي مجلد محتمل إلى مجلد dist الخاص بكاباسيتر
          mkdir -p dist
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "Dist exists and is not empty"
          elif [ -d "build" ]; then
            cp -r build/* dist/
          elif [ -d "out" ]; then
            cp -r out/* dist/
          elif [ -d "public" ]; then
            cp -r public/* dist/
          else
            echo "<h1>Nutri Pal Main App</h1>" > dist/index.html
          fi

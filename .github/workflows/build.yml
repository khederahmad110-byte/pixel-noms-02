name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build || npx vite build || true

      - name: Locate and Capture Real Web Files
        run: |
          mkdir -p dist
          
          # البحث عن أي مجلد يحتوي على الملفات الحقيقية ونسخه إلى dist
          if [ -d "dist/assets" ] && [ "$(ls -A dist/assets)" ]; then
            echo "Dist is already populated by build"
          elif [ -d "build" ] && [ "$(ls -A build)" ]; then
            cp -r build/* dist/
          elif [ -d ".output/public" ] && [ "$(ls -A .output/public)" ]; then
            cp -r .output/public/* dist/
          elif [ -d "out" ] && [ "$(ls -A out)" ]; then
            cp -r out/* dist/
          fi

          # إذا لم يوجد index.html حقيقي، سنبحث عنه في كل المستودع وننقله
          if [ ! -f "dist/index.html" ]; then
            FOUND_INDEX=$(find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              cp -r "$(dirname "$FOUND_INDEX")"/* dist/
            fi
          fi

          # ضبط المسارات لتتلاءم مع الأندرويد
          if [ -f "dist/index.html" ]; then
            sed -i 's|="/|="./|g' dist/index.html || true
            sed -i 's|="/assets/|="./assets/|g' dist/index.html || true
          fi

      - name: Install Stable Capacitor Version
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5

      - name: Create Capacitor Config File
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform Cleanly
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutripal-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

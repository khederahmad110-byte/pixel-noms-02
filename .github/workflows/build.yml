name: بناء ملف APK لنظام Android

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: رمز الدفع
        uses: actions/checkout@v4

      - name: قم بتثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: قم بتثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت الحزم الأساسية
        run: npm install --legacy-peer-deps

      - name: محاولة بناء الأصول
        continue-on-error: true
        run: npx vite build || npm run build

      - name: ضمان وجود مجلد الويب وملف HTML
        run: |
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Nutri Pal</title></head><body><div id='root'></div></body></html>" > dist/index.html
          fi

      - name: تثبيت أو إعداد المكثف
        run: npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5 --legacy-peer-deps

      - name: إنشاء ملف تكوين المكثف
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "نوتري بال",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: إعادة تهيئة منصة أندرويد بشكل آمن
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: منح صلاحية التنفيذ لـ gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: إنشاء ملف APK لنظام أندرويد
        run: |
          cd android
          ./gradlew assembleDebug

      - name: تحميل ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

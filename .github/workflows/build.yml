name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build || npx vite build || true

      - name: Force Create and Populate Dist Directory
        run: |
          mkdir -p dist
          
          # إذا وجدنا مجلد بناء جاهز ننقله، وإلا سنبحث عن index.html وننسخه
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "Dist is already ready"
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            cp -r build/* dist/
          elif [ -d ".output/public" ] && [ -f ".output/public/index.html" ]; then
            cp -r .output/public/* dist/
          else
            # البحث عن أي ملف index.html في المستودع ونسخ مجلده إلى dist
            FOUND_FILE=$(find . -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" -not -path "./dist/*" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              cp -r "$(dirname "$FOUND_FILE")"/* dist/
            fi
          fi

          # التحقق النهائي: إن لم يتوفر index.html ننشئ ملف مؤقت يطابق المشروع
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Nutri Pal</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Install Stable Capacitor Version
        run: |
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5

      - name: Create Capacitor Config File
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nutripal.app",
            "appName": "Nutri Pal",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform Cleanly
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutripal-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

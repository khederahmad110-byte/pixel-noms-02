name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo "<HTML><BODY>Nutri Pal App</BODY></HTML>" > dist/index.html
          fi

      - name: Install Ionic CLI & Capacitor
        run: |
          npm install -g @ionic/cli
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Init and Add Android Platform Cleanly
        run: |
          npx cap init "Nutri Pal" "com.nutripal.app" --web-dir dist --force || true
          rm -rf android
          npx cap add android

      - name: Update Capacitor Config for Android
        run: |
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

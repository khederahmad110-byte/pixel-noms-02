name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor & Add Android Platform
        run: |
          # تثبيت أدوات كاباسيتر إذا لم تكن موجودة
          npm install @capacitor/cli @capacitor/core @capacitor/android
          
          # تهيئة كاباسيتر إذا لم يتواجد ملف الإعدادات
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init AppName com.example.app --web-dir dist
          fi

          # إضافة منصة الأندرويد إذا لم يكن المجلد موجوداً
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # مزامنة الملفات
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
